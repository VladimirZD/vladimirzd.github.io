<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact — DevIT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#7c5cff;--glass: rgba(255,255,255,.04);--radius:14px}*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;display:flex;flex-direction:column;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial;background:linear-gradient(180deg,#071025,#081229);color:#e6eef8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}.container{max-width:1400px;margin:0 auto;padding:32px 48px}@media(max-width:768px){.container{padding:20px}}header.site-header{backdrop-filter:blur(6px);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);border-radius:calc(var(--radius) + 4px);padding:18px;margin:18px 0}.brand{display:flex;gap:12px;align-items:center}.brand .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4cc9f0);display:flex;align-items:center;justify-content:center;font-weight:700}.sticky{position:sticky}.top-4{top:1rem}.z-40{z-index:40}.backdrop-blur-md{backdrop-filter:blur(6px)}.bg-white\/3{background:#ffffff08}.rounded-xl{border-radius:12px}.p-3{padding:12px}.ml-auto{margin-left:auto}.text-white{color:#e6eef8}.text-white\/70{color:#e6eef8b3}.text-white\/80{color:#e6eef8cc}.no-underline{text-decoration:none}img{max-width:100%;height:auto;display:block}.brand img{width:48px;height:48px;-o-object-fit:cover;object-fit:cover;border-radius:8px}.card img{display:block;max-width:100%;height:auto}.hero .card{max-width:520px;margin-left:auto}.hero .card img{width:100%;height:auto;display:block}header.sticky{position:sticky;top:1rem;z-index:40}header.sticky>.container{display:flex;align-items:center;gap:16px;padding:12px;background:#ffffff08;border-radius:12px}header.sticky nav{margin-left:auto;display:flex;gap:18px;align-items:center}header.sticky nav a{color:#e6eef8cc;text-decoration:none}header.sticky nav a:hover{color:#fff}.nav{display:flex;gap:18px;align-items:center;margin-left:auto}.nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--accent)}.hero{display:grid;grid-template-columns:1fr;gap:20px;padding:48px 0}.hero h1{font-size:2.4rem;margin:0 0 8px}.hero p{color:var(--muted);margin:0 0 18px}.cta{display:inline-block;padding:10px 16px;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 6px 18px #02061799}.muted{color:var(--muted)}main{flex:1}footer{padding:28px 0;color:var(--muted)}@media(min-width:900px){.hero{grid-template-columns:1fr 420px}}.fade-up{animation:fadeUp .6s cubic-bezier(.2,.9,.2,1) both}@keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head> <body>  <header class="site-header container"> <div style="display:flex;align-items:center;gap:16px"> <div class="brand"> <div class="logo">DI</div> <div> <div style="font-weight:700">DevIT</div> <div class="muted" style="font-size:12px">SQL Server · DevOps · Terraform</div> </div> </div> <nav class="nav"> <a href="/">Home</a> <a href="/services">Services</a> <a href="/about">About</a> <a href="/contact">Contact</a> <a href="/blog">Blog</a> </nav> </div> </header> <main class="container"> <h1>Contact</h1> <p class="muted">Interested in working together? Send an email to <strong>hello@devit.example</strong> or use the form below to request a consultation.</p> <section style="margin-top:18px" class="card"> <form action="#" method="post" id="contact-form"> <!-- Honeypot field: hidden from humans, visible to bots --> <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off"> <input type="hidden" name="timestamp" id="timestamp" value=""> <label class="muted">Name<br><input name="name" required style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit"></label> <label class="muted" style="display:block;margin-top:12px">Email<br><input name="email" type="email" required style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit"></label> <label class="muted" style="display:block;margin-top:12px">Message<br><textarea name="message" rows="6" required style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit"></textarea></label> <div style="margin-top:12px"><button type="submit" class="cta">Send</button></div> </form> </section> <script type="module">document.getElementById("timestamp").value=Date.now().toString();document.getElementById("contact-form").addEventListener("submit",t=>{const e=t.target.elements.website.value,n=parseInt(t.target.elements.timestamp.value),o=(Date.now()-n)/1e3;if(e||o<3)return t.preventDefault(),console.warn("Bot protection triggered"),!1});</script> </main> <footer class="container"> <div style="display:flex;justify-content:space-between;align-items:center"> <div> <strong>DevIT</strong> <div class="muted">Proven SQL Server and DevOps consulting</div> </div> <div class="muted">© 2025 DevIT</div> </div> </footer>  </body></html>
