<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact — DevIT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/src/styles/global.css"></head> <body>  <header class="site-header container"> <div style="display:flex;align-items:center;gap:16px"> <div class="brand"> <div class="logo">DI</div> <div> <div style="font-weight:700">DevIT</div> <div class="muted" style="font-size:12px">SQL Server · DevOps · Terraform</div> </div> </div> <nav class="nav"> <a href="/">Home</a> <a href="/services">Services</a> <a href="/about">About</a> <a href="/contact">Contact</a> <a href="/blog">Blog</a> </nav> </div> </header> <main class="container"> <h1>Contact</h1> <p class="muted">Interested in working together? Send an email to <strong>hello@devit.example</strong> or use the form below to request a consultation.</p> <section style="margin-top:18px" class="card"> <form action="#" method="post" id="contact-form"> <!-- Honeypot field: hidden from humans, visible to bots --> <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off"> <input type="hidden" name="timestamp" id="timestamp" value=""> <label class="muted">Name<br><input name="name" required style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit"></label> <label class="muted" style="display:block;margin-top:12px">Email<br><input name="email" type="email" required style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit"></label> <label class="muted" style="display:block;margin-top:12px">Message<br><textarea name="message" rows="6" required style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit"></textarea></label> <div style="margin-top:12px"><button type="submit" class="cta">Send</button></div> </form> </section> <script type="module">document.getElementById("timestamp").value=Date.now().toString();document.getElementById("contact-form").addEventListener("submit",t=>{const e=t.target.elements.website.value,n=parseInt(t.target.elements.timestamp.value),o=(Date.now()-n)/1e3;if(e||o<3)return t.preventDefault(),console.warn("Bot protection triggered"),!1});</script> </main> <footer class="container"> <div style="display:flex;justify-content:space-between;align-items:center"> <div> <strong>DevIT</strong> <div class="muted">Proven SQL Server and DevOps consulting</div> </div> <div class="muted">© 2025 DevIT</div> </div> </footer>  </body></html>
